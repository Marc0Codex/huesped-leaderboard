<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>huésped · clasificación</title>
<meta name="description" content="Quién terminó la demo de HUÉSPED y quién más ha jugado.">
<style>
  :root {
    --bg: #0d0c0e;
    --text: rgba(255, 255, 255, 0.88);
    --dim: rgba(255, 255, 255, 0.46);
    --faint: rgba(255, 255, 255, 0.22);
    --glass: rgba(255, 255, 255, 0.045);
    --edge: rgba(255, 255, 255, 0.09);
    --rule: rgba(255, 255, 255, 0.06);
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); color: var(--text); }
  body {
    min-height: 100vh;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  /* dos manchas de color muy desenfocadas detrás del vidrio; es lo único que da profundidad */
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; border-radius: 50%; filter: blur(110px); pointer-events: none;
  }
  body::before { width: 46vmax; height: 46vmax; left: -14vmax; bottom: -18vmax; background: rgba(150, 38, 52, 0.34); }
  body::after { width: 34vmax; height: 34vmax; right: -10vmax; top: -12vmax; background: rgba(176, 128, 62, 0.2); }

  main { max-width: 760px; margin: 0 auto; padding: 72px 20px 56px; }
  header { margin-bottom: 36px; }
  h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.02em; }
  header p { color: var(--dim); margin-top: 4px; }

  .panel {
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 18px;
    -webkit-backdrop-filter: blur(28px) saturate(130%);
    backdrop-filter: blur(28px) saturate(130%);
    overflow: hidden;
  }
  nav { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--rule); }
  nav button {
    appearance: none; border: 0; background: transparent; color: var(--dim);
    font: inherit; padding: 8px 14px; border-radius: 12px; cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] { background: rgba(255, 255, 255, 0.08); color: var(--text); }
  nav button:focus-visible { outline: 1px solid var(--faint); outline-offset: 1px; }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 400; font-size: 12px; color: var(--faint); padding: 14px 18px 8px; white-space: nowrap; }
  td { padding: 13px 18px; border-top: 1px solid var(--rule); white-space: nowrap; }
  th.n, td.n { text-align: right; font-variant-numeric: tabular-nums; }
  td.pos { color: var(--faint); width: 44px; font-variant-numeric: tabular-nums; }
  td.dim { color: var(--dim); }
  tbody tr { transition: background 0.2s; }
  tbody tr:hover { background: rgba(255, 255, 255, 0.025); }
  .empty { padding: 56px 20px; text-align: center; color: var(--dim); }

  footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 18px; color: var(--faint); font-size: 12px; }

  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise 0.6s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  }
  @media (max-width: 520px) { main { padding-top: 40px; } td, th { padding-left: 14px; padding-right: 14px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>huésped</h1>
    <p>clasificación de la demo</p>
  </header>
  <div class="panel">
    <nav role="tablist">
      <button role="tab" id="tab-hall" aria-selected="true" aria-controls="view">terminaron la demo</button>
      <button role="tab" id="tab-const" aria-selected="false" aria-controls="view">más constantes</button>
    </nav>
    <div class="scroll" id="view" role="tabpanel"><div class="empty">cargando…</div></div>
  </div>
  <footer><span id="upd">&nbsp;</span><span>se activa al ingresar tu user en el juego</span></footer>
</main>
<script>
const API = "https://deyyrcruqjipchofigzz.supabase.co/rest/v1/rpc/";
const KEY = "sb_publishable_4NqrXtm2A7d3fP-OLJUCZg_OsCL0Zuh"; // clave pública: solo puede llamar a estas dos lecturas
const DIFF = { easy: "fácil", medium: "medio", hard: "difícil", absurd: "absurdo" };
const HOST = { classic: "clásico", speedster: "veloz", juggernaut: "titán", reaper: "segador" };
let current = "hall", cache = null, failed = false;

const fmtTime = s => { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const fmtHours = s => s >= 3600 ? (s / 3600).toFixed(1) + " h" : Math.max(1, Math.round(s / 60)) + " min";
const fmtDate = d => new Date(d).toLocaleDateString("es", { day: "numeric", month: "short" });

function row(cells) {
  const tr = document.createElement("tr");
  cells.forEach(([text, cls]) => { const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); });
  return tr;
}
function table(cols, rows) {
  const t = document.createElement("table"), h = document.createElement("tr");
  cols.forEach(([text, cls]) => { const th = document.createElement("th"); th.textContent = text; if (cls) th.className = cls; h.appendChild(th); });
  const head = document.createElement("thead"), body = document.createElement("tbody");
  head.appendChild(h); rows.forEach(r => body.appendChild(r)); t.append(head, body);
  return t;
}
function note(text) { const d = document.createElement("div"); d.className = "empty"; d.textContent = text; return d; }

function render() {
  const view = document.getElementById("view");
  view.replaceChildren();
  if (!cache) { view.appendChild(note(failed ? "no pude conectar, reintento en un minuto" : "cargando…")); return; }
  const rows = cache[current];
  if (!rows.length) { view.appendChild(note(current === "hall" ? "todavía nadie ha terminado la demo" : "todavía no hay jugadores")); return; }
  if (current === "hall") {
    view.appendChild(table([["", "pos"], ["jugador"], ["mejor tiempo", "n"], ["cuerpo"], ["dificultad"], ["desde"]],
      rows.map((r, i) => row([[i + 1, "pos"], [r.name], [fmtTime(r.best_time), "n"], [HOST[r.host] || r.host || "—", "dim"], [DIFF[r.difficulty] || r.difficulty || "—", "dim"], [fmtDate(r.first_finished_at), "dim"]]))));
  } else {
    view.appendChild(table([["", "pos"], ["jugador"], ["tiempo jugado", "n"], ["runs", "n"], ["muertes", "n"], ["mejor sala", "n"]],
      rows.map((r, i) => row([[i + 1, "pos"], [r.name], [fmtHours(r.play_time), "n"], [r.runs, "n dim"], [r.deaths, "n dim"], [r.best_room, "n dim"]]))));
  }
}

async function load() {
  try {
    const [hall, cons] = await Promise.all(["huesped_hall", "huesped_constants"].map(fn =>
      fetch(API + fn, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: "{}" })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })));
    cache = { hall, const: cons }; failed = false;
    document.getElementById("upd").textContent = "actualizado " + new Date().toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { failed = true; }
  render();
}
function select(which) {
  current = which;
  document.getElementById("tab-hall").setAttribute("aria-selected", which === "hall");
  document.getElementById("tab-const").setAttribute("aria-selected", which === "const");
  render();
}
document.getElementById("tab-hall").onclick = () => select("hall");
document.getElementById("tab-const").onclick = () => select("const");
load(); setInterval(load, 60000);
</script>
</body>
</html>
